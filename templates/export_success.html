<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Export Complete | ComicCraft
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>

<main class="container centered">

    <section class="card success">

        <span class="success-icon">
            ✓
        </span>


        <h1>
            Comic exported successfully.
        </h1>


        <p>
            Your PDF has been prepared.
        </p>


        {% if pdf_url %}

        <a
            class="button"
            href="{{ pdf_url }}"
            download
        >
            Download PDF Again
        </a>

        {% endif %}


        <a
            class="button secondary"
            href="/"
        >
            Go Create Another Comic
        </a>

    </section>

</main>

</body>

</html>
